# allie-bot: Allie 2.0 on Lichess. The API token comes from LICHESS_TOKEN, never this file.
# Override any key on the command line: allie-bot play --config this.toml --set play.rating=1800

model = "yimingzhang/allie-2.0"  # Hugging Face repo (downloaded once, 11 GB), or an export directory
device = "cpu"                # or "cuda"
dtype = "bfloat16"            # or "float32" (twice the memory; on CPU the PyTorch reference, about 3x slower)
threads = 8                   # CPU threads (0 = one per core of one socket; more are faster up to memory bandwidth)
active_experts = 0            # routed experts per token, 0 = all 16; 8 is faster, slightly less accurate
# int8 = false               # int8 weights are the CPU default (6.4 GB, about 1.6 times as fast); false: BF16
url = "https://lichess.org"
max_games = 4                 # concurrent games; the rest are declined with "later"
greeting = ""                 # sent to the opponent's chat at the start of each game
abort = 30                    # seconds without the opponent's first move before the bot aborts (3x from 15 min)

[challenge]
rated = true
casual = true
speeds = ["bullet", "blitz", "rapid", "classical"]
min_base = 60                 # seconds
max_base = 3600
min_increment = 0
max_increment = 180
humans = true
bots = false
per_user = 1                  # concurrent games with one opponent

[play]
mode = "human"                # human: sample the policy; strongest: argmax (or search); calibrated: play at
                              # the strength of humans of the rating (calibration.py); see engine.MODES
rating = "opponent"           # the bot's Elo in the game header: a number, or "opponent" to mirror it
offset = 0                    # Elo added to it; live calibrated play was 53 Elo too strong at 0 (README): -50
temperature = 1.0             # human mode; 1 is the model's own distribution
search = 0                    # strongest mode: 0 or 5 / 8 / 25 / 128 coverage-search simulations
think_time = true             # wait a think time drawn from the model's think-time head, as a human would
resign = true                 # resign as often and as late as humans of the bot's rating do (behaviour.json)
draws = true                  # offer and accept draws as humans do; false: never

[chat]                        # natural-language chat written by Claude from Allie's numbers (README)
enabled = false               # needs `uv sync --extra chat` and an Anthropic API key
rooms = ["player"]            # rooms to answer and remark in; add "spectator" for spectators
model = "claude-sonnet-5-5"
effort = "low"                # output_config.effort; thinking "between_tools" = off, for latency
max_tokens = 500              # thinking included
timeout = 8.0                 # seconds; a late message is dropped, a move never waits
key_file = "~/.config/allie/anthropic_key"  # chmod 600; ANTHROPIC_API_KEY wins if set
day_cap = 1.0                 # USD per UTC day, counted from each response's usage; then silent
month_cap = 15.0              # USD per UTC month
ledger = "~/.config/allie/chat-spend.json"  # the spend, shared by processes, kept across restarts
mix = [0.35, 0.45, 0.2]        # chances a game may remark on 1, 2, 3 kinds (one more once they chat)
p_moment = 0.7                # while they chat: chance of a remark when one of the game's kinds comes up
quiet_p_moment = 0.3          # ... until they write, or ignore `unanswered` of our lines in a row
unanswered = 2
p_draw = 0.4                  # at their declined draw offer
p_end = 0.35                  # a game's chance of a closing line (they chatted, min_plies or more, not aborted)
min_plies = 10
remarks = 4                   # remarks a game, at most
every = 6                     # plies from any call to an unprompted one, at least
scramble = 20.0               # seconds: the clock remark once a clock is under this (or 10%)
recent = 50                   # unprompted lines kept across games and not reused (beside the ledger)
replies = 30                  # calls for chat messages per game
gap = 4.0                     # seconds from our last message to an unprompted one, at least
typing = 20.0                 # replies at this many characters a second from the message, 1.5-6 s (0: at once)
linger = 120.0                # seconds of answers after the game (longer after each message)
poll = 5.0                    # seconds to the first chat fetch after the game, doubling while nobody writes
