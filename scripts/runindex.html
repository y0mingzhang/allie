<style>

    --model: #8F9CFF; --data: #3EC3C1; --sweep: #DB8FD4; --check: #8E9AAB;

.legend i.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--c); }
.legend i.ring { width: 9px; height: 9px; border: 1.5px solid var(--c); border-radius: 50%; }
.empty { color: var(--muted); font-size: 14px; background: var(--raise); border-radius: 12px; padding: 18px; margin: 0; }
.alerts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }

.selbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.selbar .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; font: 500 12px var(--mono); }
.selbar .chip::before { content: ""; width: 10px; height: 3px; border-radius: 2px; background: var(--c); }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13.5px; margin: 0; }

.mono { font-family: var(--mono); font-size: 12.5px; }
dialog.sheet { border: 0; border-radius: 16px; padding: 0; max-width: min(720px, calc(100vw - 24px)); width: 100%; background: var(--ground); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }

.sheet .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.sheet .top h3 { font: 600 15px var(--mono); overflow-wrap: anywhere; }
.btn { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, max(340px, calc(50% - 12px))), 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, max(300px, calc(33.3% - 12px))), 1fr)); gap: 12px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 90ch; }
.foot { color: var(--muted); font-size: 12.5px; padding-top: 28px; max-width: 90ch; }
@media (max-width: 600px) {
  .lede h2 { font-size: 20px; }
  .controls input[type="search"] { width: 100%; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .heat td { min-width: 58px; padding: 5px 5px; }
}
@media (prefers-reduced-motion: no-preference) { .tabs button, .chips button { transition: background .12s, color .12s; } }

<div class="bar">
  <div class="row"><h1>Allie Runs</h1><span class="fresh" id="fresh"></span></div>

<script id="data" type="application/json">/*RUNINDEX_DATA*/{}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent || "{}");
const RUNS = (D.runs && D.runs.runs) || [], CUR = D.curves || {}, SW = D.sweep || {}, CP = D.compute || {};
const BY = Object.fromEntries(RUNS.map(r => [r.name, r]));
const GEN = D.runs && D.runs.generated, NOW = Date.now() / 1000, TZ = "America/Los_Angeles", TOK = 524288 / 1e9;
const VIEWS = [["runs", "Runs"], ["results", "Results"], ["curves", "Curves"], ["moe", "MoE health"], ["speed", "Speed"], ["data", "Data"], ["sweep", "Sweep"], ["compute", "Compute"]];
const STATUS = {
  running: ["Training", "var(--ok)"], queued: ["Queued", "var(--info)"], scoring: ["Scoring", "var(--sweep)"], scored: ["Scored", "var(--muted)"],
  stopped: ["Stopped", "var(--warn)"], failed: ["Failed", "var(--bad)"], planned: ["Planned", null], "not run": ["Not run", null],
};
const ORDER = ["running", "queued", "scoring", "stopped", "failed", "scored", "planned", "not run"];
const RANK = { running: 0, queued: 1, scoring: 2, stopped: 3, failed: 3, scored: 3, planned: 4, "not run": 5 };
const TRACK = { sweep: ["Sweep", "var(--sweep)"], check: ["Checks", "var(--check)"], model: ["Model", "var(--model)"], data: ["Data", "var(--data)"], other: ["Other", "var(--muted)"] };
const FAM = { S16: "var(--s1)", dense: "var(--s2)", "MoE (older)": "var(--s3)" };
const SLOTS = [1, 2, 3, 4, 5, 6, 7, 8].map(i => `var(--s${i})`);
const GPUC = { L40S: "var(--s1)", A6000: "var(--s3)", H100: "var(--s7)", "RTX PRO 6000": "var(--s2)", "RTX 6000 Ada": "var(--s4)" };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ok = v => typeof v === "number" && isFinite(v);
const f = (v, d = 3) => ok(v) ? v.toFixed(d) : "—";
const sg = (v, d = 4) => ok(v) ? (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d) : "—";
const pc = (v, d = 1) => ok(v) ? (100 * v).toFixed(d) + "%" : "—";
const big = v => !ok(v) ? "—" : v >= 1e9 ? (v / 1e9).toFixed(v >= 1e10 ? 1 : 2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(0) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(Math.round(v));
const cmx = v => ok(v) ? v.toFixed(2) + "×" : "—";
const tf = new Intl.DateTimeFormat("en-US", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const hf = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric" });
const hourOf = t => +new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", hourCycle: "h23" }).format(new Date(t * 1000));
const when = t => ok(t) ? tf.format(new Date(t * 1000)) : "—";
const ago = t => { if (!ok(t)) return "—"; const s = NOW - t; return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 172800 ? `${(s / 3600).toFixed(1)} h ago` : `${Math.round(s / 86400)} d ago`; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("allie-runs." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("allie-runs." + k, JSON.stringify(v)); } catch { } },
};
const pill = s => { const [t, c] = STATUS[s] || [s, null]; return c ? `<span class="pill" style="--c:${c}">${t}</span>` : `<span class="pill hollow">${esc(t)}</span>`; };
const fam = r => `<span class="fam" style="--c:${FAM[r.family] || "var(--faint)"}">${esc(r.family)}</span>`;
const open = n => `<button class="nm" data-open="${esc(n)}">${esc(n)}</button>`;
const active = r => ["running", "queued", "scoring"].includes(r.status);
const SEV = { nan: "var(--bad)", diverging: "var(--bad)", stalled: "var(--bad)", spike: "var(--warn)", starved: "var(--warn)", "data-bound": "var(--warn)" };

const S = {
  tab: (location.hash || "").slice(1) || store.get("tab", "runs"),
  q: "", track: store.get("track", "all"), st: store.get("st", "all"), sort: store.get("sort", ["status", 1]),
  rtrack: store.get("rtrack", "all"), metric: store.get("metric", "ce"), x: store.get("x", "tok"),
  sm: store.get("sm", "macro"), parity: "all", more: {}, focus: null, dfocus: null, mfocus: null, heat: "imb", sel: [],
};
if (!VIEWS.some(v => v[0] === S.tab)) S.tab = "runs";
(function initSel() {
  const saved = store.get("sel", null);
  const pick = (saved || []).filter(n => BY[n]);
  const dflt = RUNS.filter(r => r.status === "running").map(r => r.name);
  const recent = RUNS.filter(r => r.res).sort((a, b) => (b.res.t || 0) - (a.res.t || 0)).map(r => r.name);
  (pick.length ? pick : dflt.length ? dflt : recent).slice(0, 4).forEach(n => select(n, true));
})();
function select(n, on) {
  const i = S.sel.findIndex(x => x.name === n);
  if (on && i < 0 && S.sel.length < 8) { const used = new Set(S.sel.map(x => x.slot)); S.sel.push({ name: n, slot: [0, 1, 2, 3, 4, 5, 6, 7].find(k => !used.has(k)) }); }
  if (!on && i >= 0) S.sel.splice(i, 1);
  store.set("sel", S.sel.map(x => x.name));
}
const color = n => { const x = S.sel.find(x => x.name === n); return x ? SLOTS[x.slot] : "var(--faint)"; };

/* ---------------------------------------------------------------- charts */
function niceTicks(lo, hi, n) {
  const span = hi - lo; if (!(span > 0)) return [lo];
  let step = Math.pow(10, Math.floor(Math.log10(span / n))); const e = span / n / step;
  step *= e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
function logTicks(lo, hi) {
  const out = []; for (let d = Math.floor(lo); d <= Math.ceil(hi); d++) for (const m of [1, 2, 5]) { const v = m * Math.pow(10, d), l = Math.log10(v); if (l >= lo - 1e-9 && l <= hi + 1e-9) out.push(v); }
  return out.length > 7 ? out.filter(v => Math.abs(Math.log10(v) % 1) < 1e-9) : out;
}
function timeTicks(lo, hi) {
  const span = (hi - lo) / 3600, step = [1, 2, 3, 6, 12, 24].find(s => span / s <= 6) || 24, out = [];
  if (!(span > 0 && span < 24 * 30)) return out;
  for (let t = Math.ceil(lo / 3600) * 3600; t <= hi; t += 3600) if (hourOf(t) % step === 0) out.push(t);

    <div class="card"><h3>dei governor</h3><dl class="kv"><dt>Process</dt><dd>${gov.alive ? `<span class="good">running</span>` : `<span class="worse">not running</span>`}</dd><dt>Holding</dt><dd class="mono">${esc((gov.held || []).join(", ") || "nothing")}</dd><dt>Labmates waiting</dt><dd class="mono">${esc((CP.dei_waiting || []).map(x => `${x.user} ${x.id} (${x.reason})`).join(", ") || "none")}</dd><dt>Last log</dt><dd class="mono" style="font-size:11.5px">${(gov.log || []).map(esc).join("<br>") || "—"}</dd></dl></div></div>
    <div class="sect"><header><h3>Our jobs now</h3></header>${table(jobs, jcols)}</div>`;
  const ser = CP.series || [];
  charts(el, POOLS.map(([k], i) => ["cs-" + i, { series: [{ name: k, color: "var(--s1)", pts: ser.map(s => [s[0], s[1 + i]]) }], hlines: [{ y: k === "dei-group" ? 16 : (p[k] || {}).cap || 0, label: "cap" }, ...(k === "dei-group" && ser.some(s => s[5]) ? [{ y: 8, label: "labmate cap" }] : [])], time: true, y0: 0, extraY: [k === "dei-group" ? 16 : (p[k] || {}).cap || 1], x0: NOW - 48 * 3600, x1: NOW, tipfmt: v => v + " GPUs", tipx: t => when(t), h: 150, direct: false, empty: "The compute log starts with the first snapshot." }]));
}

/* ---------------------------------------------------------------- events */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, input[type=checkbox]"); if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.open) return sheet(d.open);
  if (t.id === "closesheet") return $("#sheet").close();
  if (d.selToggle) { select(d.selToggle, !S.sel.some(x => x.name === d.selToggle)); sheet(d.selToggle); return render(); }
  if (d.sel) { select(d.sel, t.checked); return render(); }
  if (d.unsel) { select(d.unsel, false); return render(); }
  if (d.preset) { if (d.preset === "clear") { S.sel = []; store.set("sel", []); } else RUNS.filter(r => r.status === "running").slice(0, 8).forEach(r => select(r.name, true)); return render(); }
  if (d.chip) { S[d.chip] = d.v; store.set(d.chip, d.v); return render(); }
  if (d.seg) { S[d.seg] = d.v; store.set(d.seg, d.v); return render(); }
  if (d.focus) { S.focus = d.focus; return render(); }
  if (d.more) { S.more[d.more] = true; return render(); }
  if (d.dfocus) { S.dfocus = d.dfocus; return render(); }
  if (d.sort) {
    const key = { runs: "sort", results: "rsort", moe: "msort", speed: "ssort" }[S.tab]; if (!key) return;
    const cur = key === "sort" ? S.sort : store.get(key, [d.sort, 1]), next = [d.sort, cur[0] === d.sort ? -cur[1] : 1];
    if (key === "sort") S.sort = next; store.set(key, next); return render();
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "addrun" && ev.target.value) { select(ev.target.value, true); render(); }
  if (ev.target.id === "mfocus") { S.mfocus = ev.target.value; render(); }
});
let qt; document.addEventListener("input", ev => {
  if (ev.target.id !== "q") return;
  S.q = ev.target.value; clearTimeout(qt);
  qt = setTimeout(() => { const pos = ev.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch { } } }, 180);
});
$("#sheet").addEventListener("click", ev => { if (ev.target.id === "sheet") $("#sheet").close(); });
let lastW = innerWidth, rt; addEventListener("resize", () => { if (Math.abs(innerWidth - lastW) < 8) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(render, 150); });
addEventListener("hashchange", () => { const t = location.hash.slice(1); if (VIEWS.some(v => v[0] === t) && t !== S.tab) go(t); });
renderShell(); render();
</script>
