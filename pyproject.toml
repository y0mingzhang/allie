[project]
name = "allie"
version = "3.0.0"
description = "Human chess move prediction: a mixture-of-experts transformer over the game, ratings and clock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Allie 2.0 trained with torch 2.10.0+cu128 and triton 3.6.0 on Linux x86-64.
dependencies = [
    "torch==2.10.*",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pyarrow>=15",
    "chess>=1.10",
    "zstandard>=0.22",
    "matplotlib>=3.9",
    "requests>=2.31",
]

[project.optional-dependencies]
# allie.search: the native tree search build
search = ["pybind11>=3.0,<4"]
# allie.lichess: weights from the Hugging Face Hub, and exporting them from a training checkpoint
bot = ["huggingface_hub>=0.20", "safetensors>=0.4"]
# allie.lichess.chat: game chat written by Claude (off unless [chat] enabled)
chat = ["anthropic>=1.0"]
test = ["pytest>=8"]
# docs/make_figures.py: Vega-Lite charts rendered to PNG
figures = ["altair>=5.5", "vl-convert-python>=1.7"]

[project.scripts]
allie-train = "allie.cli:train"
allie-eval = "allie.cli:evaluate"
allie-exp = "allie.experiments.modelexp:main"
allie-bot = "allie.lichess.cli:main"
allie-predict = "allie.lichess.api:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allie"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: needs a CUDA GPU",
    "data: reads the game stores or evaluation sets under ALLIE_DATA",
    "history: compares against an earlier commit, so needs this repository's git history",
]
