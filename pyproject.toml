[project]
name = "allie"
version = "0.2.0"
description = "Human chess move prediction: a mixture-of-experts transformer over the game, ratings and clock"
readme = "README.md"
requires-python = ">=3.12"
# The big run trained with torch 2.10.0+cu128 and triton 3.6.0 on Linux x86-64.
dependencies = [
    "torch==2.10.*",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pyarrow>=15",
    "chess>=1.10",
    "zstandard>=0.22",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# search/: native tree search build and model export
search = ["pybind11>=3.0,<4", "safetensors>=0.4"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
