[package]
name = "allie-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Allie's CPU engine in Rust: the int8 forward, KV caches and the tree searches, for allie.lichess"
license = "MIT"

[lib]
name = "allie_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
numpy = "0.22"
shakmaty = "0.27"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
