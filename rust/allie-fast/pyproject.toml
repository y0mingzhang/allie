[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "allie-fast"
version = "0.1.0"
description = "Allie's CPU engine in Rust (allie.lichess's fast backend and tree searches)"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.maturin]
module-name = "allie_fast"
features = ["pyo3/extension-module"]

[tool.uv]
# rebuild the extension when its Rust sources change (uv otherwise reuses the built wheel)
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
